<svg width="47.4902" height="47.4902" viewBox="-1 -1 49.4902 49.4902" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Third sparkle of the WYG header trio (Figma #1729:2721). In the file
     this is the same four-point star as its siblings, but with a
     near-invisible fill (black @1%) plus a GLASS effect (radius 22), so
     Figma renders only the material's refraction highlights: the
     top-left and bottom-right edges catch the light (brightest toward the
     top and right tips) while the other two edges stay dark. The plain
     SVG export drops the effect and comes back invisible, so the two lit
     edges are drawn here as strokes off the original path data. -->
<defs>
<linearGradient id="wyg-sparkle-glass" x1="0" y1="47.4902" x2="47.4902" y2="0" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFFFFF" stop-opacity="0.05"/>
<stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.42"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
</linearGradient>
</defs>
<path d="M-0.00191483 23.7422C12.6621 22.5549 22.5559 12.6611 23.7432 -0.00291054" fill="none" stroke="url(#wyg-sparkle-glass)" stroke-width="1.1" stroke-linecap="round"/>
<path d="M47.4883 23.7422C34.8242 24.9294 24.9304 34.8232 23.7432 47.4873" fill="none" stroke="url(#wyg-sparkle-glass)" stroke-width="1.1" stroke-linecap="round"/>
</svg>
